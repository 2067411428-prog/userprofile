<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profiles</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 35px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .profile-list {
            max-width: 900px;
            margin: 0 auto;
            display: grid;
            gap: 25px;
        }

        /* ---------- 用户卡片 ---------- */
        .profile-card {
            background: #fff;
            border-radius: 16px;
            padding: 30px 35px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border-top: 5px solid #2c5364;
        }

        .profile-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.3);
        }

        /* 头部：姓名 + 邮箱 */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 18px;
        }

        .avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2c5364, #203a43);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .name-block .full-name {
            font-size: 1.35rem;
            font-weight: 700;
            color: #222;
        }

        .name-block .email {
            font-size: 0.95rem;
            color: #777;
        }

        /* 详情行 */
        .detail-row {
            display: flex;
            gap: 12px;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .detail-row .label {
            font-weight: 600;
            color: #555;
            min-width: 110px;
        }

        .detail-row .value {
            color: #333;
        }

        /* 偏好区域 */
        .section-title {
            margin-top: 18px;
            margin-bottom: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #2c5364;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 5px;
        }

        .prefs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .pref-tag {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .tag-theme {
            background: #e8f4fd;
            color: #1a73e8;
        }

        .tag-lang {
            background: #e6f7e6;
            color: #2e7d32;
        }

        .tag-notify-yes {
            background: #fff3e0;
            color: #e65100;
        }

        .tag-notify-no {
            background: #fce4ec;
            color: #c62828;
        }

        .tag-sub-yes {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .tag-sub-no {
            background: #f5f5f5;
            color: #999;
        }

        /* 加载 / 错误 */
        .loading {
            text-align: center;
            color: #fff;
            font-size: 1.2rem;
            padding: 40px;
        }

        .error {
            text-align: center;
            color: #ff6b6b;
            font-size: 1.15rem;
            padding: 35px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            max-width: 900px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <h1>👤 User Profiles</h1>
    <div class="profile-list" id="profileList">
        <div class="loading">Loading user profiles...</div>
    </div>

    <script>
        // ---- 使用 fetch API 获取 JSON 数据 ----
        fetch('userProfiles.json')
            .then(response => {
                if (!response.ok)
                    throw new Error('Fetch error: ' + response.status);
                else
                    return response.json();
            })
            .then(json => {
                // ---- 解析后的数据处理 ----
                const users = json.users;
                const list = document.getElementById('profileList');
                list.innerHTML = '';

                users.forEach(user => {
                    const initials = user.firstName.charAt(0) + user.lastName.charAt(0);

                    const notifyTag = user.preferences.notifications
                        ? '<span class="pref-tag tag-notify-yes">🔔 Notifications: On</span>'
                        : '<span class="pref-tag tag-notify-no">🔕 Notifications: Off</span>';

                    const subTag = user.preferences.subscription
                        ? '<span class="pref-tag tag-sub-yes">✅ Subscribed</span>'
                        : '<span class="pref-tag tag-sub-no">❌ Not Subscribed</span>';

                    const card = document.createElement('div');
                    card.className = 'profile-card';
                    card.innerHTML = `
                        <div class="profile-header">
                            <div class="avatar">${initials}</div>
                            <div class="name-block">
                                <div class="full-name">${user.firstName} ${user.lastName}</div>
                                <div class="email">${user.email}</div>
                            </div>
                        </div>

                        <div class="detail-row">
                            <span class="label">Date of Birth:</span>
                            <span class="value">${user.dateOfBirth}</span>
                        </div>

                        <div class="section-title">📍 Address</div>
                        <div class="detail-row">
                            <span class="label">Street:</span>
                            <span class="value">${user.address.street}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">City:</span>
                            <span class="value">${user.address.city}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">State:</span>
                            <span class="value">${user.address.state}</span>
                        </div>
                        <div class="detail-row">
                            <span class="label">Zip Code:</span>
                            <span class="value">${user.address.zipCode}</span>
                        </div>

                        <div class="section-title">⚙️ Preferences</div>
                        <div class="prefs">
                            <span class="pref-tag tag-theme">🎨 Theme: ${user.preferences.theme}</span>
                            <span class="pref-tag tag-lang">🌐 Language: ${user.preferences.language}</span>
                            ${notifyTag}
                            ${subTag}
                        </div>
                    `;
                    list.appendChild(card);
                });
            })
            .catch(err => {
                document.getElementById('profileList').innerHTML =
                    '<div class="error">' + 'Fetch error: ' + err.message + '</div>';
                console.error('Fetch error: ' + err.message);
            });
    </script>

</body>
</html>
